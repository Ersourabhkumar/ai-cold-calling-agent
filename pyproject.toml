[project]
name = "ai-cold-calling-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.16",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "jinja2>=3.1",
    "openai>=3.6.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0",
    "twilio>=9.11.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]
